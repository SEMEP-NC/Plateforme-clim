<IfModule mod_ssl.c>

<VirtualHost *:443>

    ServerName ${HOST_IP}

    DocumentRoot /var/www/html

    SSLEngine on

    SSLCertificateFile /etc/ssl/certs/clim.crt
    SSLCertificateKeyFile /etc/ssl/private/clim.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

    Header always set Strict-Transport-Security "max-age=31536000"

</VirtualHost>

</IfModule>